<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherStudio Connect</title>

    <link rel="icon" type="image/png" href="https://github.com/Accident404/SamahanNgMgabaluga/blob/main/Resources/logo.png?raw=true">
    <meta name="description" content="Access the ArcherStudio Connect portal to manage your student profile, view business solutions, and collaborate with our creative team.">

    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f7f3e9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbxdO7bEUydxqghEY7YpceUCT7fb2bVp-G0VX4fRk93Ej2hUJSEhAG46m5eDEr2uguw/exec" 
    allow="fullscreen; clipboard-write;"
    allowfullscreen="true">
  </iframe>
<script>
  // 1. Get the current URL parameters from the GitHub page
  const params = window.location.search; 

  // 2. Select the iframe
  const frame = document.querySelector('iframe');

  // 3. Append the parameters to the src if they exist
  if (params) {
    frame.src += params;
  }
</script>
</body>
</html>
