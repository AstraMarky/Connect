<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherStudio Connect</title>

    <link rel="icon" type="image/png" href="https://github.com/Accident404/SamahanNgMgabaluga/blob/main/Resources/logo.png?raw=true">
    <meta name="description" content="Access the ArcherStudio Connect portal to manage your student profile, view business solutions, and collaborate with our creative team.">

    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- THE MINIMALIST LOADER --- */
        .loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #fff;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
}

.loading-screen.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.loader-container img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    display: none !important; 
}

/* LAPTOP VIEW (1025px and up) */
@media (min-width: 1025px) {
    .loader-container .loader-laptop { display: block !important; }
    .logo-wrapper .logo-laptop { display: block !important; }
    .hamburger-btn { display: none; }
}

        
           @media (min-width: 768px) {
        .loader-container .loader-laptop { display: block !important; } 
        .logo-wrapper .logo-medium { display: block !important; }
    }

    @media (max-width: 767px) {
        .loader-container .loader-mobile { display: block !important; }
        .logo-wrapper .logo-mobile { display: block !important; }
        
        .navbar { padding: 12px 20px; }
        .logo-wrapper .logo { height: 35px; }

        @keyframes soft-pulse {
            0%, 100% { opacity: 0.7; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1); }
        }
    }

        /* --- IFRAME STYLING --- */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0; 
            transition: opacity 0.5s ease-in; 
        }
    </style>

</head>
<body>


    <div  id="clean-loader" class="loading-screen">
        <div class="loader-container">
            <img src="https://github.com/AstraMarky/Connect/blob/main/resources/img/loading2.gif?raw=true" alt="Loading Laptop" class="loader-img loader-laptop">
            <img src="https://github.com/AstraMarky/Connect/blob/main/resources/img/loading1.gif?raw=true" alt="Loading Mobile" class="loader-img loader-mobile">
        </div>
    </div>

<iframe id="app-frame" title="ArcherStudio Connect Portal"></iframe>
<script>
    (function initApp() {
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxNbekgmyrn9RydcCoNf09ZkbtZhNycH3s_J-3K3ultr6dMLmwH4vEAzuwk0ZXd-aU/exec";
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('clean-loader');

        iframe.onload = function () {
            loader.style.opacity = '0';
            iframe.style.opacity = '1';
            setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
        };

        const urlParams = new URLSearchParams(window.location.search);

        // --- Handle New Login Data (Saving to localStorage) ---
        const studentIdParam = urlParams.get('studentid');
        if (studentIdParam && studentIdParam.trim() !== "") {
            const keysToSave = ['studentId', 'email', 'surname', 'firstName', 'middleName', 'yearSection', 'groupid', 'groupnumber', 'groupname', 'address', 'phoneNumber'];

            keysToSave.forEach(key => {
                const val = urlParams.get(key) || urlParams.get(key.toLowerCase());
                if (val && val !== 'undefined' && val !== 'null') {
                    let storageKey = key;
                    if (key === 'groupid') storageKey = 'groupId';
                    if (key === 'groupnumber') storageKey = 'groupNumber';
                    if (key === 'groupname') storageKey = 'groupname';
                    localStorage.setItem(storageKey, val);
                }
            });

            // Redirect to clean URL after login, preserving only the Dashboard page
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=Dashboard';
            window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }

        // --- Auth Check ---
        const savedStudentId = localStorage.getItem('studentId');
        const isLoggedIn = savedStudentId !== null && savedStudentId.trim() !== '';

        // page param comes AFTER the redirect above so re-read from current urlParams
        // If login just happened, urlParams still has the original params before replaceState
        // so we re-parse from the actual current location
        const currentParams = new URLSearchParams(window.location.search);
        let requestedPage = currentParams.get('page') || urlParams.get('page') || (isLoggedIn ? 'Dashboard' : 'Login');

        // --- Build iframe URL ---
        let finalIframeUrl = GAS_URL + "?page=" + encodeURIComponent(requestedPage);

        if (isLoggedIn) {
            // URL params take priority over localStorage for group/page context
            const groupid     = urlParams.get('groupid')     || urlParams.get('groupId')     || localStorage.getItem('groupId')     || '';
            const groupnumber = urlParams.get('groupnumber') || urlParams.get('groupNumber') || localStorage.getItem('groupNumber') || '';
            const groupname   = urlParams.get('groupname')   || localStorage.getItem('groupname') || '';

            const params = {
                studentid:    savedStudentId,
                email:        localStorage.getItem('email')       || '',
                firstName:    localStorage.getItem('firstName')   || '',
                middleName:   localStorage.getItem('middleName')  || '',
                surname:      localStorage.getItem('surname')     || '',
                yearSection:  localStorage.getItem('yearSection') || '',
                groupid:      groupid,
                groupnumber:  groupnumber,
                groupname:    groupname,
                address:      localStorage.getItem('address')     || '',
                phoneNumber:  localStorage.getItem('phoneNumber') || ''
            };

            const handledKeys = new Set([
                'page','studentid','email','firstname','middlename','surname',
                'yearsection','groupid','groupnumber','groupname','address','phonenumber'
            ]);

            for (const [key, value] of Object.entries(params)) {
                if (value !== null && value !== undefined && value !== '') {
                    finalIframeUrl += `&${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
                }
            }

            // Forward any extra URL params not already handled
            urlParams.forEach((value, key) => {
                if (!handledKeys.has(key.toLowerCase()) && value && value !== 'undefined' && value !== 'null') {
                    finalIframeUrl += `&${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
                }
            });
        }

        iframe.src = finalIframeUrl;
    })();
</script>
</body>
</html>
