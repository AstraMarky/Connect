<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherStudio Connect</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="app-frame" title="ArcherStudio Connect Portal"></iframe>

    <script>
        // --- 1. CONFIGURATION ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbznxgeeJ4WnxtTE6Sz_ATP4RNi2FvUqhDOGM9KBaX0485tLCLirfHhA-LWqASZa2aM/exec";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            let requestedPage = urlParams.get('page') || 'Login';

            // --- 2. CAPTURE & SAVE DATA (If redirected from Login) ---
            const studentIdParam = urlParams.get('studentid');
            
            if (studentIdParam) {
                // Save all passed data to the browser's LocalStorage
                localStorage.setItem('studentId', studentIdParam);
                localStorage.setItem('email', urlParams.get('email') || '');
                localStorage.setItem('surname', urlParams.get('surname') || '');
                localStorage.setItem('firstName', urlParams.get('firstName') || '');
                localStorage.setItem('middleName', urlParams.get('middleName') || '');
                localStorage.setItem('yearSection', urlParams.get('yearSection') || '');
                
                requestedPage = 'Dashboard';

                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=Dashboard';
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }

            // --- 3. AUTHENTICATION CHECK ---
            const savedStudentId = localStorage.getItem('studentId');
            const isLoggedIn = savedStudentId !== null && savedStudentId.trim() !== '';

            // --- 4. ROUTING LOGIC ---
            if (!isLoggedIn) {
                if (requestedPage !== 'Register') {
                    requestedPage = 'Login';
                }
            } else {
                // ALREADY LOGGED IN: Prevent them from accidentally going to the Login/Register pages
                if (requestedPage === 'Login' || requestedPage === 'Register') {
                    requestedPage = 'Dashboard';
                    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=Dashboard';
                    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
                }
            }

// --- 5. LOAD THE IFRAME ---
            // Tell the Google Apps Script which page to serve and who the user is
            const iframe = document.getElementById('app-frame');
            
            // Build the final iframe URL
            let finalIframeUrl = GAS_URL + "?page=" + requestedPage;
            
            if (isLoggedIn) {
                // Retrieve the rest of the data from LocalStorage
                const savedEmail = localStorage.getItem('email') || '';
                const savedFirstName = localStorage.getItem('firstName') || '';
                const savedMiddleName = localStorage.getItem('middleName') || '';
                const savedSurname = localStorage.getItem('surname') || '';

                // Pass everything to the GAS backend so it can build the Dashboard
                // Using encodeURIComponent prevents spaces/special characters from breaking the URL
                finalIframeUrl += "&studentid=" + encodeURIComponent(savedStudentId); 
                finalIframeUrl += "&email=" + encodeURIComponent(savedEmail); 
                finalIframeUrl += "&firstName=" + encodeURIComponent(savedFirstName); 
                finalIframeUrl += "&middleName=" + encodeURIComponent(savedMiddleName); 
                finalIframeUrl += "&surname=" + encodeURIComponent(savedSurname); 
            }
            
            iframe.src = finalIframeUrl;
        };
    </script>
</body>
</html>
