    <meta name="description" content="Access the ArcherStudio Connect portal to manage your student profile, view business solutions, and collaborate with our creative team.">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="app-frame" title="ArcherStudio Connect Portal"></iframe>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzwXokVdOOChIVd6NRkc_arYvO8BOCA30YEQoGnGc5jfFuwooz8NsdgQOLMgDkESKk/exec";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // --- LOGOUT HANDLER ---
            if (urlParams.get('logout') === 'true') {
                localStorage.clear(); 
                window.history.replaceState({}, '', window.location.pathname + '?page=Login');
            }

            let requestedPage = urlParams.get('page') || 'Login';

            // --- 1. HANDLE NEW LOGIN / USER DATA ---
            const studentIdParam = urlParams.get('studentid');
            if (studentIdParam && studentIdParam.trim() !== "") {
                localStorage.setItem('studentId', studentIdParam);
                localStorage.setItem('email', urlParams.get('email') || '');
                localStorage.setItem('surname', urlParams.get('surname') || '');
                localStorage.setItem('firstName', urlParams.get('firstName') || '');
                localStorage.setItem('middleName', urlParams.get('middleName') || '');
                localStorage.setItem('yearSection', urlParams.get('yearSection') || '');
                
                // --- THE FIX: GRAB GROUP DATA FROM URL ---
                const newGroupId = urlParams.get('groupid');
                const newGroupNum = urlParams.get('groupnumber');
                const newGroupName = urlParams.get('groupname');
                if (newGroupId) localStorage.setItem('groupId', newGroupId);
                if (newGroupNum) localStorage.setItem('groupNumber', newGroupNum);
                if (newGroupName) localStorage.setItem('groupname', newGroupName);
                
                requestedPage = 'Dashboard';

                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=Dashboard';
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }

            // --- 2. HANDLE GROUP SWITCHING ---
            const groupIdParam = urlParams.get('groupid');
            const groupNumParam = urlParams.get('groupnumber');
            
            if (groupIdParam && groupNumParam && !studentIdParam) { // Added !studentIdParam to prevent overriding the login set
                localStorage.setItem('groupId', groupIdParam);
                localStorage.setItem('groupNumber', groupNumParam);

                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=' + requestedPage;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }

            // --- 3. AUTHENTICATION CHECK ---
            const savedStudentId = localStorage.getItem('studentId');
            const isLoggedIn = savedStudentId !== null && savedStudentId.trim() !== '';

            if (!isLoggedIn) {
                if (requestedPage !== 'Register') {
                    requestedPage = 'Login';
                }
            } else {
                if (requestedPage === 'Login' || requestedPage === 'Register') {
                    requestedPage = 'Dashboard';
                    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=Dashboard';
                    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
                }
            }

            // --- 4. BUILD IFRAME URL SAFELY ---
            const iframe = document.getElementById('app-frame');
            let finalIframeUrl = GAS_URL + "?page=" + requestedPage;
            
            if (isLoggedIn) {
                const savedEmail = localStorage.getItem('email') || '';
                const savedFirstName = localStorage.getItem('firstName') || '';
                const savedMiddleName = localStorage.getItem('middleName') || '';
                const savedSurname = localStorage.getItem('surname') || '';
                const savedYearSection = localStorage.getItem('yearSection') || '';
                const savedGroupId = localStorage.getItem('groupId') || '';
                const savedGroupNum = localStorage.getItem('groupNumber') || '';
                const savedGroupNum = localStorage.getItem('groupName') || '';

                if (savedStudentId) finalIframeUrl += "&studentid=" + encodeURIComponent(savedStudentId); 
                if (savedEmail) finalIframeUrl += "&email=" + encodeURIComponent(savedEmail); 
                if (savedFirstName) finalIframeUrl += "&firstName=" + encodeURIComponent(savedFirstName); 
                if (savedMiddleName) finalIframeUrl += "&middleName=" + encodeURIComponent(savedMiddleName); 
                if (savedSurname) finalIframeUrl += "&surname=" + encodeURIComponent(savedSurname); 
                if (savedYearSection) finalIframeUrl += "&yearSection=" + encodeURIComponent(savedYearSection);
                if (savedGroupId) finalIframeUrl += "&groupid=" + encodeURIComponent(savedGroupId);
                if (savedGroupNum) finalIframeUrl += "&groupnumber=" + encodeURIComponent(savedGroupNum);
                if (savedGroupNum) finalIframeUrl += "&groupname=" + encodeURIComponent(groupName);
            }
            
            iframe.src = finalIframeUrl;
        };
    </script>
</body>
</html>
